<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资料预览</title>
<style>
:root{--blue:#4a90d9;--ink:#2b3a4a;--muted:#7a8a9a;--line:#e6ecf3;--bg:#f5f7fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(40,60,90,.04);flex:0 0 auto}
.back{font-size:14px;color:var(--blue);text-decoration:none;font-weight:600;white-space:nowrap}
.back:hover{text-decoration:underline}
.ttl{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{margin-left:auto;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.toggle:hover{border-color:var(--blue);color:var(--blue)}
.content{flex:1 1 auto;min-height:0;display:flex;overflow:auto}
.pane{flex:1 1 50%;min-width:0;position:relative}
.pane + .pane{border-left:2px solid var(--line)}
.pane iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.pane .label{position:absolute;top:8px;left:10px;font-size:12px;color:#fff;background:rgba(43,58,74,.72);padding:2px 9px;border-radius:6px;z-index:2;pointer-events:none}
body.answer-hidden .pane.main{flex:1 1 100%}
body.answer-hidden .pane.ans{display:none}
.msg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:15px;width:100%}
.audio-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.audio-wrap audio{width:min(680px,90%)}
.local-list{width:100%;max-width:520px;margin:0 auto;padding:14px 16px}
.local-row{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line)}
.local-row:last-child{border-bottom:none}
.local-tag{font-size:13px;font-weight:600;flex:0 0 52px}
.fileopen{font-size:13px;color:var(--blue);border:1px solid var(--blue);padding:7px 14px;border-radius:8px;text-decoration:none;white-space:nowrap}
.fileopen:hover{text-decoration:underline}
.filehint{font-size:12px;color:var(--muted);line-height:1.6;padding:0 16px 14px;max-width:520px;margin:0 auto}
.topnote{padding:8px 16px;font-size:12px;color:var(--muted);background:#fff;border-bottom:1px solid var(--line)}
@media (max-width:760px){
  .content{flex-direction:column}
  .pane + .pane{border-left:none;border-top:2px solid var(--line)}
  body.answer-hidden .pane.main{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← 返回列表</a>
  <span class="ttl" id="ttl">预览</span>
  <button class="toggle" id="toggleAnswer" style="display:none">收起答案</button>
</div>
<div class="topnote" id="topnote" style="display:none">本地打开模式：点下方按钮在新窗口查看文件。</div>
<div class="content" id="content"><div class="msg">加载中…</div></div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var isFile=(location.protocol==='file:');
  function safe(v){ v=decodeURIComponent(v||''); return (!v||v.indexOf('..')>-1||/^[a-z]+:/i.test(v))?null:v; }
  var src=safe(p.get('src')), answer=safe(p.get('answer')), rawTitle=p.get('title');
  var c=document.getElementById('content');
  if(isFile && src && !/\.(mp3|m4a|wav|ogg)$/i.test(src)){ document.getElementById('topnote').style.display=''; }
  if(!src){ c.innerHTML='<div class="msg">无效的文件路径</div>'; return; }
  var name=(src.split('/').pop().replace(/\.[^.]+$/,'')||'预览');
  var title=rawTitle?decodeURIComponent(rawTitle):name;
  document.getElementById('ttl').textContent=title;
  document.title=title+' · 预览';
  function isAudio(s){ var e=(s.split('.').pop()||'').toLowerCase(); return (e==='mp3'||e==='m4a'||e==='wav'||e==='ogg'); }
  function audioHTML(s){ return '<div class="audio-wrap"><audio controls autoplay src="'+encodeURI(s)+'"></audio></div>'; }
  function paneHTML(s,kind,text){
    var inner=isAudio(s)?audioHTML(s):'<iframe src="'+encodeURI(s)+'"></iframe>';
    return '<div class="pane '+kind+'">'+inner+(text?'<span class="label">'+text+'</span>':'')+'</div>';
  }
  if(isAudio(src)){
    c.innerHTML=paneHTML(src,'main','');
    return;
  }
  /* 本地 file:// 模式：不内嵌 PDF，改成紧凑的一行一个「新窗口打开」 */
  if(isFile){
    var rows='<div class="local-row"><span class="local-tag">题目</span>'
      +'<a class="fileopen" href="'+encodeURI(src)+'" target="_blank" rel="noopener">在新窗口打开</a></div>';
    if(answer){
      rows+='<div class="local-row"><span class="local-tag">答案</span>'
        +'<a class="fileopen" href="'+encodeURI(answer)+'" target="_blank" rel="noopener">在新窗口打开</a></div>';
    }
    c.innerHTML='<div class="local-list">'+rows+'</div>'
      +'<div class="filehint">本地打开无法内嵌 PDF。若要题目与答案左右并排，请用本地服务器方式访问。</div>';
    return;
  }
  var html=paneHTML(src,'main','题目');
  if(answer){
    html+=paneHTML(answer,'ans','答案');
    var btn=document.getElementById('toggleAnswer');
    btn.style.display='';
    btn.onclick=function(){
      document.body.classList.toggle('answer-hidden');
      btn.textContent=document.body.classList.contains('answer-hidden')?'展开答案':'收起答案';
    };
  }
  c.innerHTML=html;
})();
</script>
</body>
</html>
